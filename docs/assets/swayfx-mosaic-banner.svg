<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">SwayFX Mosaic — Spatial Canvas for SwayFX</title>
  <desc id="desc">Three ordered tiled rows extend across a dark logical canvas. A lavender viewport frame shows the visible part of a wider row.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#313244" stroke-width="1" opacity=".35"/></pattern>
    <clipPath id="canvas"><rect x="54" y="52" width="630" height="225" rx="11"/></clipPath>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#1e1e2e"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <text x="56" y="38" fill="#a6adc8" font-family="sans-serif" font-size="14" letter-spacing="2">LOGICAL CANVAS</text>
  <g clip-path="url(#canvas)" font-family="sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    <g fill="#313244" stroke="#89b4fa" stroke-width="2"><rect x="56" y="64" width="130" height="57" rx="7"/><rect x="194" y="64" width="130" height="57" rx="7"/><rect x="332" y="64" width="130" height="57" rx="7"/><rect x="470" y="64" width="130" height="57" rx="7"/><rect x="608" y="64" width="130" height="57" rx="7"/></g>
    <g fill="#cdd6f4"><text x="121" y="100">A</text><text x="259" y="100">B</text><text x="397" y="100">C</text><text x="535" y="100">D</text><text x="673" y="100">E</text></g>
    <g fill="#313244" stroke="#a6e3a1" stroke-width="2"><rect x="56" y="133" width="130" height="57" rx="7"/><rect x="194" y="133" width="130" height="57" rx="7"/><rect x="332" y="133" width="130" height="57" rx="7"/><rect x="470" y="133" width="130" height="57" rx="7"/><rect x="608" y="133" width="130" height="57" rx="7"/></g>
    <g fill="#cdd6f4"><text x="121" y="169">F</text><text x="259" y="169">G</text><text x="397" y="169">H</text><text x="535" y="169">I</text><text x="673" y="169">J</text></g>
    <g fill="#313244" stroke="#cba6f7" stroke-width="2"><rect x="56" y="202" width="130" height="57" rx="7"/><rect x="194" y="202" width="130" height="57" rx="7"/><rect x="332" y="202" width="130" height="57" rx="7"/><rect x="470" y="202" width="130" height="57" rx="7"/><rect x="608" y="202" width="130" height="57" rx="7"/></g>
    <g fill="#cdd6f4"><text x="121" y="238">K</text><text x="259" y="238">L</text><text x="397" y="238">M</text><text x="535" y="238">N</text><text x="673" y="238">O</text></g>
  </g>
  <rect x="190" y="57" width="414" height="208" rx="11" fill="none" stroke="#cba6f7" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M190 281v14h414v-14" fill="none" stroke="#cba6f7" stroke-width="2"/>
  <text x="397" y="312" text-anchor="middle" fill="#cba6f7" font-family="sans-serif" font-size="15" letter-spacing="1">PHYSICAL VIEWPORT</text>
  <rect x="750" y="64" width="4" height="202" rx="2" fill="#cba6f7"/>
  <text x="794" y="130" fill="#cdd6f4" font-family="sans-serif" font-size="44" font-weight="700">SwayFX Mosaic</text>
  <text x="796" y="172" fill="#cba6f7" font-family="sans-serif" font-size="22">Spatial Canvas for SwayFX</text>
  <text x="796" y="225" fill="#a6adc8" font-family="sans-serif" font-size="17">Native tiled layout · Experimental</text>
</svg>
